<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>样式测试页面</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            secondary: '#8b5cf6',
            accent: '#ec4899',
            dark: '#0f172a',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .glass-effect {
        @apply bg-white/85 dark:bg-dark/95 backdrop-blur-md border border-white/20 dark:border-white/10 shadow-lg;
      }
      
      .glass-effect-dark {
        @apply bg-dark/95 backdrop-blur-md border border-white/10 shadow-lg;
      }
    }
    
    body {
      @apply bg-gray-50 dark:bg-dark text-gray-800 dark:text-white transition-colors duration-300;
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8 text-center">样式测试页面</h1>
    
    <!-- 主题切换按钮 -->
    <div class="text-center mb-8">
      <button id="theme-toggle" class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors duration-300">
        切换深色/浅色模式
      </button>
    </div>
    
    <!-- 颜色测试 -->
    <div class="mb-8">
      <h2 class="text-2xl font-bold mb-4">颜色测试</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="p-4 bg-primary text-white rounded-lg">主色调 (primary)</div>
        <div class="p-4 bg-secondary text-white rounded-lg">辅助色 (secondary)</div>
        <div class="p-4 bg-accent text-white rounded-lg">强调色 (accent)</div>
        <div class="p-4 bg-dark text-white rounded-lg">深色背景 (dark)</div>
      </div>
    </div>
    
    <!-- 毛玻璃效果测试 -->
    <div class="mb-8">
      <h2 class="text-2xl font-bold mb-4">毛玻璃效果测试</h2>
      <div class="relative h-64 mb-4 rounded-lg overflow-hidden">
        <img src="https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/super_tool/905e70cacd784d399614f9360b83d117~tplv-a9rns2rl98-image.image?rcl=202511191001432FDB426A7F2164EABA08&rk3s=8e244e95&rrcfp=f06b921b&x-expires=1766109744&x-signature=wrpel0AQtf4mcN9KoUhO%2FuZ0KeY%3D" 
             alt="背景图片" 
             class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="glass-effect p-8 rounded-xl text-center">
            <h3 class="text-xl font-bold mb-2">毛玻璃效果</h3>
            <p>这是一个毛玻璃效果的示例</p>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 按钮测试 -->
    <div class="mb-8">
      <h2 class="text-2xl font-bold mb-4">按钮测试</h2>
      <div class="flex flex-wrap gap-4">
        <button class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors duration-300">
          主要按钮
        </button>
        <button class="px-6 py-2 border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors duration-300">
          次要按钮
        </button>
        <button class="px-6 py-2 bg-transparent border border-primary text-primary rounded-lg hover:bg-primary hover:text-white transition-colors duration-300">
          边框按钮
        </button>
      </div>
    </div>
    
    <!-- 卡片测试 -->
    <div class="mb-8">
      <h2 class="text-2xl font-bold mb-4">卡片测试</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="glass-effect p-6 rounded-xl">
          <h3 class="text-xl font-bold mb-2">卡片标题</h3>
          <p class="text-gray-700 dark:text-gray-300 mb-4">这是一个卡片示例，包含标题和描述文本。</p>
          <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors duration-300">
            查看详情
          </button>
        </div>
        
        <div class="glass-effect p-6 rounded-xl">
          <h3 class="text-xl font-bold mb-2">卡片标题</h3>
          <p class="text-gray-700 dark:text-gray-300 mb-4">这是一个卡片示例，包含标题和描述文本。</p>
          <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors duration-300">
            查看详情
          </button>
        </div>
        
        <div class="glass-effect p-6 rounded-xl">
          <h3 class="text-xl font-bold mb-2">卡片标题</h3>
          <p class="text-gray-700 dark:text-gray-300 mb-4">这是一个卡片示例，包含标题和描述文本。</p>
          <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors duration-300">
            查看详情
          </button>
        </div>
      </div>
    </div>
    
    <!-- 表单测试 -->
    <div class="mb-8">
      <h2 class="text-2xl font-bold mb-4">表单测试</h2>
      <div class="glass-effect p-6 rounded-xl">
        <form class="space-y-4">
          <div>
            <label for="name" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">姓名</label>
            <input 
              type="text" 
              id="name" 
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
              placeholder="请输入您的姓名"
            >
          </div>
          
          <div>
            <label for="email" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">邮箱</label>
            <input 
              type="email" 
              id="email" 
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
              placeholder="请输入您的邮箱"
            >
          </div>
          
          <div>
            <label for="message" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">留言</label>
            <textarea 
              id="message" 
              rows="4"
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
              placeholder="请输入您的留言"
            ></textarea>
          </div>
          
          <div>
            <button 
              type="submit" 
              class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors duration-300"
            >
              提交
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // 主题切换功能
    const themeToggle = document.getElementById('theme-toggle');
    
    // 检查本地存储中的主题偏好
    if (localStorage.getItem('theme') === 'dark' || 
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
    
    // 切换主题
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDarkMode = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
    });
  </script>
</body>
</html>
